# tennis-live — live match state runtime (TennisCast).
# Deploy: docs/RELEASE.md. Secrets (wrangler secret put) are listed per Worker; values never in Git.
name = "tennis-live"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

[[kv_namespaces]]
binding = "TENNIS_STATE"
id = "a117d7b3846c4a39a27ee74c49574c99"

[[r2_buckets]]
binding = "TENNIS_SOURCE"
bucket_name = "tennis-source"

[triggers]
crons = ["* * * * *"]

# Secrets: TENNIS_MODEL_SUPABASE_URL, TENNIS_MODEL_SUPABASE_SERVICE_ROLE_KEY

# "1" only after migration 20261004000100_tennis_match_schedule_day.sql is applied: tennis-live writes live-owned
# editions through tennis-ingest editionMatches, so it carries the same sourced day-of-play columns as tennis-ingest
[vars]
SCHEDULE_DAY_COLUMNS = "1"
