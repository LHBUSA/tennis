# tennis-api — public read API (tennis-api.propbetedge.ai).
# Deploy: docs/RELEASE.md. Secrets (wrangler secret put) are listed per Worker; values never in Git.
name = "tennis-api"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [{ pattern = "tennis-api.propbetedge.ai", custom_domain = true }]

[observability]
enabled = true

[[kv_namespaces]]
binding = "TENNIS_STATE"
id = "a117d7b3846c4a39a27ee74c49574c99"

# Secrets: TENNIS_MODEL_SUPABASE_URL, TENNIS_MODEL_SUPABASE_SERVICE_ROLE_KEY (sports project only)

[[r2_buckets]]
binding = "TENNIS_MEDIA"
bucket_name = "tennis-media"

# frozen pre-match matchup snapshots (intel/matchup-prematch/, write-once) — matchup-freeze.js
[[r2_buckets]]
binding = "TENNIS_SOURCE"
bucket_name = "tennis-source"

[triggers]
crons = ["*/10 * * * *"]


# Network membership authority. Tennis has no sport-only plan; premium grants
# come from active PropBetEdge All Access or verified owner identity.
[[services]]
binding = "AUTH"
service = "propbetedge-auth-magic"
