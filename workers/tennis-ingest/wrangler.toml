# tennis-ingest — source acquisition, normalization, backfill.
# Deploy: docs/RELEASE.md. Secrets (wrangler secret put) are listed per Worker; values never in Git.
name = "tennis-ingest"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

[[kv_namespaces]]
binding = "TENNIS_STATE"
id = "a117d7b3846c4a39a27ee74c49574c99"

[[r2_buckets]]
binding = "TENNIS_SOURCE"
bucket_name = "tennis-source"

[triggers]
crons = ["*/2 * * * *"]

# Secrets: TENNIS_MODEL_SUPABASE_URL, TENNIS_MODEL_SUPABASE_SERVICE_ROLE_KEY, INGEST_ADMIN_TOKEN

[[r2_buckets]]
binding = "TENNIS_MEDIA"
bucket_name = "tennis-media"

# DNA v2 builds read the whole singles ledger (~60k rows) once a day
[limits]
cpu_ms = 300000

# "1" only after migration 20261004000100_tennis_match_schedule_day.sql is applied (sourced day-of-play columns)
[vars]
SCHEDULE_DAY_COLUMNS = "0"
